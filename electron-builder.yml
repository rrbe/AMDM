appId: com.shawn.amdm
productName: AMDM
copyright: Copyright © 2026 shawn

directories:
  buildResources: build # icon.icns / icon.ico / icon.png live here
  output: dist

# electron-builder adds production dependencies separately.
files:
  - out/**/*
  - package.json

# The Sparkle addon is built as a stable N-API module; JS dependencies still do
# not need an Electron ABI rebuild.
npmRebuild: false
afterPack: scripts/after-pack.mjs

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  extendInfo:
    # afterPack replaces this with the architecture-specific feed URL.
    SUFeedURL: https://github.com/rrbe/AMDM/releases/latest/download/appcast-arm64.xml
    SUPublicEDKey: yF0fhsSuotJutGHezmoAFb3+M7nA6gcOln5aEWycXp8=
    SUEnableAutomaticChecks: true
    # Keep scheduled checks automatic, but let Sparkle show its native update
    # prompt. `true` silently downloads and installs on quit, which makes the
    # update appear invisible; LocalShare deliberately uses the same setting.
    SUAutomaticallyUpdate: false
    SUScheduledCheckInterval: 86400
  extraResources:
    - from: build/sparkle/native/sparkle.node
      to: native/sparkle.node
  extraFiles:
    - from: build/sparkle/Sparkle.framework
      to: Frameworks/Sparkle.framework
  target:
    # Both architectures are NATIVE builds — arm64 for Apple Silicon, x64 for
    # Intel. "No Rosetta" means no emulation, which these two
    # native targets satisfy; it does NOT mean arm64-only.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  maintainer: shawn
  target:
    - AppImage
