appId: com.shawn.amdm
productName: AMDM
copyright: Copyright © 2026 shawn

directories:
  buildResources: build   # icon.icns / icon.ico / icon.png live here
  output: dist

# electron-builder adds production dependencies separately.
files:
  - out/**/*
  - package.json

# This project deliberately avoids native modules (see ADR-0006), so there is
# nothing to rebuild against Electron's ABI.
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    # Both architectures are NATIVE builds — arm64 for Apple Silicon, x64 for
    # Intel. ADR-0004 rule #7 says "no Rosetta" (don't emulate), which these two
    # native targets satisfy; it does NOT mean arm64-only.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  title: ${productName} ${version}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build/icon.png
  category: Development
  maintainer: shawn
  target:
    - AppImage
