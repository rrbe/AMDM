name: CI

# Core checks and UI smoke for PRs/master; full cross-platform regression runs daily.
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/screenshots/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/screenshots/**']

# Supersede older PR checks while keeping master push runs independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MONGOMS_VERSION: 8.2.1
      MONGOMS_DOWNLOAD_DIR: .cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v6

      # No `version:` here — pnpm/action-setup reads it from package.json's
      # `packageManager` field (single source of truth). Specifying both errors.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-8.2.1

      # mongodb-memory-server's postinstall is intentionally not allowed
      # (onlyBuiltDependencies); it would otherwise try to download mongod.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + contract tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

      - name: Web production build
        run: pnpm build:web

      - name: Web runtime
        run: pnpm test:web

      - name: Package native architecture
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm exec install-electron
          pnpm package:dir

      - name: Core UI E2E
        run: xvfb-run --auto-servernum pnpm test:e2e:smoke

      - name: UI smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ runner.os }}-${{ runner.arch }}
          path: dist/e2e-validation/smoke-shell/
          if-no-files-found: ignore
