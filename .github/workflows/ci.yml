name: CI

# Validate source, ESM builds, and packaged Electron runtimes on every platform.
on:
  push:
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MONGOMS_VERSION: 8.2.1
      MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
    steps:
      - uses: actions/checkout@v6

      # No `version:` here — pnpm/action-setup reads it from package.json's
      # `packageManager` field (single source of truth). Specifying both errors.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ runner.arch }}-8.2.1

      # mongodb-memory-server's postinstall is intentionally not allowed
      # (onlyBuiltDependencies); it would otherwise try to download mongod.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + contract tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

      - name: Prepare Sparkle
        if: runner.os == 'macOS'
        run: pnpm prepare:sparkle

      - name: Package native architecture
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const cli = createRequire(import.meta.url).resolve('electron-builder/out/cli/cli.js');
          const result = spawnSync(process.execPath, [cli, '--dir', '--' + process.arch,
            '--config.electronDist=node_modules/electron/dist'], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS

      - name: Packaged ESM runtime (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:packaged

      - name: Packaged ESM runtime (macOS / Windows)
        if: runner.os != 'Linux'
        run: pnpm test:packaged

      - name: Runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esm-runtime-${{ runner.os }}-${{ runner.arch }}
          path: dist/runtime-validation/
          if-no-files-found: ignore
